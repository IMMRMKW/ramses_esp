name: Build ESP32 Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build (fresh sdkconfig from defaults)
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.4.1
        target: esp32c6
        path: .
        command: >-
          rm -f sdkconfig && export SDKCONFIG_DEFAULTS=sdkconfig.defaults &&
          export RAMSES_RELEASE_VERSION=$(git describe --tags --exact-match 2>/dev/null || git describe --tags --always) &&
          idf.py set-target esp32c6 && idf.py reconfigure && idf.py build

    - name: Create firmware package
      run: |
        set -e
        mkdir -p release
        # HTTPS OTA writes an application partition, not a merged flash image.
        cp build/ramses_esp_c6.bin release/ramses_esp_c6.bin
        sha256sum release/ramses_esp_c6.bin > release/ramses_esp_c6.bin.sha256
        # Keep flash_args for the USB flash image merge step.
        cp build/flash_args release/ 2>/dev/null || true

    - name: Package OTA images and catalogues
      if: startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      run: python tools/package_ota.py --version "$RELEASE_VERSION"

    - name: Build single flash image
      run: |
        set -e
        if [ ! -f build/flash_args ]; then
          echo "flash_args not found; cannot create merged image" >&2
          exit 1
        fi
        pip install --no-cache-dir esptool
        mkdir -p release
        # Run merge inside build dir so relative paths in flash_args resolve
        (
          cd build
          python -m esptool --chip esp32c6 merge-bin -o ../release/ramses_esp_esp32_c6.bin $(tr '\n' ' ' < flash_args)
        )
        # Produce checksum for integrity verification (optional)
        (sha256sum release/ramses_esp_esp32_c6.bin || shasum -a 256 release/ramses_esp_esp32_c6.bin) > release/ramses_esp_esp32_c6.bin.sha256 || true
        ls -lh release/ramses_esp_esp32_c6.bin

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/ramses_esp_c6.bin
          release/ramses_esp_c6.bin.sha256
          release/ramses_esp_c6.ota
          release/update.json
          release/zha-ota.json
          release/z2m-ota.json
          release/ramses_esp_esp32_c6.bin
          release/ramses_esp_esp32_c6.bin.sha256
        generate_release_notes: true
        draft: false
        prerelease: false
        body: |
          Auto-generated release for ${{ github.ref_name }}.
          Single merged firmware image: ramses_esp_esp32_c6.bin
          Wi-Fi OTA application image: ramses_esp_c6.bin
          Flash example (Linux/macOS):
            python -m esptool --chip esp32c6 write_flash 0x0 ramses_esp_esp32_c6.bin
          Flash example (Windows PowerShell):
            py -m esptool --chip esp32c6 write_flash 0x0 .\ramses_esp_esp32_c6.bin
          Setup instructions: see project wiki.

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32c6-firmware-single
        path: release/
